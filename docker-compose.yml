# AutoAgent Docker Compose
# 运行指南:
#   启动基础设施:        docker compose up -d postgres redis
#   启动 API (首次或代码未变): docker compose up -d api
#   代码变更后重启 API:        docker compose up -d --build api
#   启动前端 (开发模式, 热更新):    docker compose up -d frontend
#   前端依赖变更后重建:           docker compose up -d --build frontend
#   查看前端日志:             docker compose logs -f frontend
#   前端访问地址:             http://localhost:5173 (通过 Vite 代理转发至 api:8000)
#   启动 Prometheus 监控:        docker compose up -d observability
#   查看监控面板:             http://localhost:9090
#   查看监控服务日志:           docker compose logs -f observability
#   一次性启动全部服务:        docker compose up -d
#   查看日志: docker compose logs -f api
#   停止: docker compose down
# 注意: 仿真环境变量由场景池(configs/scene_pool.yaml)提供,无需外部仿真器
#       前端开发模式通过卷挂载(frontend:/app)实现热更新,生产环境应使用
#       `npm run build` 输出 frontend/dist 后由静态服务器托管。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: autoagent-postgres
    environment:
      POSTGRES_USER: autoagent
      POSTGRES_PASSWORD: autoagent
      POSTGRES_DB: autoagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autoagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoagent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql+psycopg2://autoagent:autoagent@postgres:5432/autoagent
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  observability:
    image: prom/prometheus:latest
    container_name: autoagent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: autoagent-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  frontend_node_modules:
