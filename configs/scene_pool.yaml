# 场景池配置 - 替代 CARLA 仿真的环境变量来源
# 运行指南:
#   由 app/simulation/scene_pool.py 读取,每次 get_state 随机选取一个场景
#   自定义场景: 在 scenes 列表中追加条目即可,vehicle/environment 字段均可缺省(使用默认值)
#   scene.name 仅用于日志追踪,不参与业务逻辑

scenes:
  - name: "urban_clear_noon"
    description: "城市道路,晴朗中午,中等交通"
    vehicle:
      speed_kmh: 42.0
      battery_percent: 78.0
      cabin_temperature_c: 24.5
      ac_enabled: true
      target_temperature_c: 24.0
      latitude: 40.0123
      longitude: 116.4567
      current_road: "城市环路高架"
    environment:
      weather: "clear"
      traffic_density: "medium"
      road_work: false
      pedestrians: true
      confidence: 0.9

  - name: "highway_sunny"
    description: "高速公路,晴天,低交通"
    vehicle:
      speed_kmh: 108.0
      battery_percent: 65.0
